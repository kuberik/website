{{- /* Edge state for render-table.html cards: .kd-more-r / .kd-more-l show the fades when a table has more to the
     right / left; .kd-pin pins the key column while the rest scrolls when that column takes at most 40% of the card. */ -}}
<script>(()=>{const f=s=>{const w=s.parentNode,m=s.scrollWidth-s.clientWidth,k=s.querySelector('th,td'),kw=k?k.offsetWidth:0,pin=m>1&&getComputedStyle(k).display==='table-cell'&&kw<=s.clientWidth*.4;w.classList.toggle('kd-pin',pin);w.style.setProperty('--kd-key-w',(pin?kw:0)+'px');w.classList.toggle('kd-more-r',m>1&&s.scrollLeft<m-1);w.classList.toggle('kd-more-l',m>1&&s.scrollLeft>1)};const all=()=>document.querySelectorAll('.kd-table-scroll').forEach(f);document.addEventListener('scroll',e=>{const t=e.target;if(t.classList&&t.classList.contains('kd-table-scroll'))f(t)},true);addEventListener('resize',all);all();addEventListener('load',all)})();</script>
