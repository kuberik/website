{{- /* Copy, always visible in the code window head (phones have no hover). Same hooks as hextra's button
     (.hextra-code-copy-btn, .hextra-copy-icon, .hextra-success-icon) so core/code-copy.js keeps working. */ -}}
<div class="hextra-code-copy-btn-container kd-copy-wrap">
  <button class="hextra-code-copy-btn kd-copy" type="button" title="Copy code" aria-label="Copy code">
    <span class="hextra-copy-icon kd-copy-icon" aria-hidden="true"></span><span class="hextra-success-icon kd-copy-icon" aria-hidden="true"></span><span class="kd-copy-l">Copy</span><span class="kd-copy-done">Copied</span>
  </button>
</div>
