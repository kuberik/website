# The landing page's words (v4 wording, v5 structure: .work/landing-v5/page/BRIEF.md).
# hero.h1 is THE swappable headline: <title>, og:title and the h1 read this one string.
hero:
  eyebrow: "Open source · Apache 2.0 · Works with Flux"
  h1: "Safe, hands-off deployments for Kubernetes."
  sub: "Declare deploy windows, dependencies, canaries, smoke tests and health checks once, and Kuberik promotes every release from dev to every production region."
  proof: "Runs in your cluster · no agent to install"

# THESIS: the two-tone statement (Linear) and the loop drawn below it. The only "special" section: it is the
# product's thesis. Capability names live in `features`, once; the loop keeps only its questions.
thesis:
  claim: "Kuberik is a controller that lives in your cluster."
  rest: "Every build goes through the same five phases. You write a Rollout and a ReleaseSource, add gates and health checks when you want them, and Kuberik runs the rest."
  phases:
    - { fig: release, name: release, own: "Yours",    q: "Which versions are available?" }
    - { fig: guard,   name: guard,   own: "Kuberik",  q: "Is it safe to deploy here?" }
    - { fig: gates,   name: gates,   own: "Optional", q: "Which version may go now?" }
    - { fig: update,  name: update,  own: "Kuberik",  q: "How does it reach the cluster?" }
    - { fig: health,  name: health,  own: "Optional", q: "Did it actually work?" }

# FEATURES: six peers, one anatomy (visual card, title, two lines of body, one docs link).
# Every sentence is checked against content/docs (fact sheet in BRIEF.md "Truth rules").
features:
  title: "Every step of a release, declared."
  body: "Gates, health checks, canaries and waves are declared on resources the controller reconciles in each cluster. Write them once and every build goes through them."
  # Order = the bento (assets/css/features.css): Gates on its own row; Canary beside Health over GitOps; Dashboard beside Releases.
  # hue = the card's canvas tint (lagoon / mint). The footer's Product links follow this order.
  items:
    - id: gates
      hue: lagoon
      name: "Gates"
      title: "A build waits until every gate passes."
      body: "A deploy window, the environment before it and the version of a service it depends on each hold the build. When the last gate passes, it deploys on its own. An approval can be one of the gates."
      link: { text: "How gates work", href: "/docs/concepts/gates/" }
    - id: canary
      hue: mint
      name: "Canary and waves"
      title: "Wave 2 starts when the canary in wave 1 has baked."
      body: "OpenKruise shifts traffic in steps and runs a test at the step you pick. Once every region in wave 1 has baked the release, the regions in wave 2 start together."
      link: { text: "Run a canary", href: "/docs/releases/canary/" }
    - id: health
      hue: mint
      name: "Health checks"
      title: "A release has to stay healthy for the whole bake."
      body: "Kuberik watches your Flux Kustomization and Datadog monitors from the deploy to the end of the bake time. If one of them fails, so does the release, and it goes no further."
      link: { text: "Add health checks", href: "/docs/gates/health-checks/" }
    - id: gitops
      hue: lagoon
      name: "GitOps"
      title: "Flux stays in charge of your cluster."
      body: "Kuberik never applies manifests. It writes the new version into your Kustomization's substitutions, and Flux rolls out the Deployment and everything else that uses it."
      link: { text: "Connect Flux", href: "/docs/integrations/fluxcd/" }
    - id: dashboard
      hue: lagoon
      name: "Dashboard"
      title: "Find where a pull request is running."
      body: "Paste its link into the dashboard search. The change opens with the environments that run it, the one it is deploying to now and the ones still to come, across all your clusters."
      link: { text: "Follow a change", href: "/docs/operate/dashboard/#follow-a-change" }
    - id: releases
      hue: mint
      name: "Releases"
      title: "Every new tag becomes a release you can trace."
      body: "A ReleaseSource watches your OCI registry, orders the tags by version and records each release's digest and the git commit it was built from."
      link: { text: "Publish releases", href: "/docs/releases/publish/" }

# STEP IN (landing v6j/v6k, LANDING-REVIEW.md): day-2 operation. "Hands-off" invites the question "and when it goes wrong?";
# this answers it with the one person-driven story the vignette enacts: a failed release, rolled back from the history,
# which pins (rollouts/[..]/+page.svelte "A rollback started in this product ALWAYS pins"; spec.wantedVersion).
# v6k: the actions list (Roll back / Retry / Skip once / Approve + handles) left the landing (owner: "not sure we need
# these on the landing"); the docs page lists them.
stepin:
  name: "Day two"
  title: "Step in when a release needs you."
  body: "When a release fails, roll it back from the rollout's history; Kuberik keeps that build pinned until you clear the pin."
  link: { text: "Operate a rollout", href: "/docs/operate/manual-actions/" }
