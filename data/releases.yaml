  - { name: "environment-controller", tag: "v0.1.5" }
  - { name: "rollout-dashboard", tag: "v0.9.2" }
  - { name: "datadog-controller", tag: "v0.1.0" }
  - { name: "openkruise-controller", tag: "v0.4.1" }
  - { name: "Helm chart", tag: "0.7.0" }
# Components with no release tag yet: documented from main only.
unreleased: ["release-controller", "prometheus-controller"]
